name: CI

# Every push / PR: build the web apps, run server tests, and compile the desktop shell.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/actionlint@v1.7.10

  web-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Web apps (typecheck + build + unit tests)
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run test:words
          npm run test:barcode

      - name: Server (tests + jar)
        working-directory: server
        run: mvn -B verify

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Compile desktop shell
        working-directory: desktop/src-tauri
        run: |
          cargo check --locked || cargo check
          cargo clippy -- -D warnings
