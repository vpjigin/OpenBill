name: Release

# Push a tag like v1.0.0 (matching "version" in desktop/src-tauri/tauri.conf.json).
# workflow_dispatch: full matrix build + artifact upload (no GitHub Release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actionlint:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/actionlint@v1.7.10

  build:
    needs: [actionlint]
    if: ${{ always() && (needs.actionlint.result == 'success' || needs.actionlint.result == 'skipped') }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            java-arch: x64
            rust-target: ""
            args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            java-arch: aarch64
            rust-target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            os: macos-latest
            java-arch: x64
            rust-target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - name: Linux x64
            os: ubuntu-22.04
            java-arch: x64
            rust-target: ""
            args: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: ${{ matrix.java-arch }}
          cache: maven

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.rust-target }}

      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Build server jar + bundled Java runtime
        shell: bash
        env:
          SKIP_TESTS: "true"
        run: bash ./scripts/build-server.sh

      - name: Bundle cloudflared
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest) bash ./scripts/fetch-cloudflared.sh windows amd64 ;;
            ubuntu-22.04)   bash ./scripts/fetch-cloudflared.sh linux amd64 ;;
            macos-latest)
              if [[ -n "${{ matrix.rust-target }}" && "${{ matrix.rust-target }}" == "x86_64-apple-darwin" ]]; then
                bash ./scripts/fetch-cloudflared.sh darwin amd64
              else
                bash ./scripts/fetch-cloudflared.sh darwin arm64
              fi
              ;;
            *) echo "No cloudflared mapping for ${{ matrix.os }}" >&2; exit 1 ;;
          esac

      - name: Install desktop tooling
        working-directory: desktop
        shell: bash
        run: npm ci

      - name: Export optional signing secrets
        shell: bash
        env:
          _APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          _APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          _TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          _TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export_if_set() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              return 0
            fi
            {
              echo "${name}<<EOF"
              printf '%s\n' "$value"
              echo "EOF"
            } >> "$GITHUB_ENV"
          }
          export_if_set APPLE_CERTIFICATE "$_APPLE_CERTIFICATE"
          export_if_set APPLE_CERTIFICATE_PASSWORD "$_APPLE_CERTIFICATE_PASSWORD"
          export_if_set APPLE_SIGNING_IDENTITY "$_APPLE_SIGNING_IDENTITY"
          export_if_set APPLE_ID "$_APPLE_ID"
          export_if_set APPLE_PASSWORD "$_APPLE_PASSWORD"
          export_if_set APPLE_TEAM_ID "$_APPLE_TEAM_ID"
          export_if_set TAURI_SIGNING_PRIVATE_KEY "$_TAURI_SIGNING_PRIVATE_KEY"
          export_if_set TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$_TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Build installers (workflow_dispatch / non-tag)
        if: github.event_name == 'workflow_dispatch' || !startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        shell: bash
        run: npm run build -- ${{ matrix.args }}

      - name: Upload installers (workflow_dispatch / non-tag)
        if: github.event_name == 'workflow_dispatch' || !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.name }}
          path: desktop/src-tauri/target/**/release/bundle/**/*
          if-no-files-found: error

      - name: Publish draft GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: |
            Download the installer for your computer below.
            - Windows: .msi or -setup.exe
            - macOS: .dmg (aarch64 = Apple Silicon M1/M2/M3, x64 = Intel). Unsigned builds: right-click the app → Open the first time.
            - Linux: .deb (Ubuntu/Debian), .rpm (Fedora), or .AppImage (any distro)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload stable download aliases (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          if [[ -n "${{ matrix.rust-target }}" ]]; then
            BUNDLE_ROOT="desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          else
            BUNDLE_ROOT="desktop/src-tauri/target/release/bundle"
          fi
          if [[ ! -d "$BUNDLE_ROOT" ]]; then
            echo "Bundle dir not found: $BUNDLE_ROOT" >&2
            exit 1
          fi

          find_one() {
            local pattern="$1"
            local hit
            hit="$(find "$BUNDLE_ROOT" -type f -name "$pattern" | head -n 1)"
            if [[ -z "$hit" ]]; then
              echo "No file matching $pattern under $BUNDLE_ROOT" >&2
              find "$BUNDLE_ROOT" -type f | head -n 40 >&2 || true
              exit 1
            fi
            printf '%s' "$hit"
          }

          upload_alias() {
            local src="$1"
            local dest="$2"
            echo "Uploading $src as $dest"
            gh release upload "$TAG" "${src}#${dest}" --clobber
          }

          case "${{ matrix.name }}" in
            "Windows x64")
              upload_alias "$(find_one "OpenBill_${VER}_x64-setup.exe")" "OpenBill-Windows-Setup.exe"
              upload_alias "$(find_one "OpenBill_${VER}_x64*.msi")" "OpenBill-Windows.msi"
              ;;
            "macOS Apple Silicon")
              upload_alias "$(find_one "OpenBill_${VER}_aarch64.dmg")" "OpenBill-macOS-AppleSilicon.dmg"
              ;;
            "macOS Intel")
              upload_alias "$(find_one "OpenBill_${VER}_x64.dmg")" "OpenBill-macOS-Intel.dmg"
              ;;
            "Linux x64")
              upload_alias "$(find_one "OpenBill_${VER}_amd64.AppImage")" "OpenBill-Linux.AppImage"
              upload_alias "$(find_one "OpenBill_${VER}_amd64.deb")" "OpenBill-Linux.deb"
              upload_alias "$(find_one "OpenBill_${VER}_amd64.rpm")" "OpenBill-Linux.rpm"
              ;;
            *)
              echo "Unknown matrix name: ${{ matrix.name }}" >&2
              exit 1
              ;;
          esac

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Mark GitHub Release as published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
